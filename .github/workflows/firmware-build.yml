name: ESP32 firmware build

on:
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  push:
    branches: [master]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32-c3, esp32-c3-web, ttgo-t-display, ttgo-t-display-s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build firmware
        working-directory: firmware
        run: pio run -e ${{ matrix.environment }}
      - name: Package firmware binary
        shell: bash
        run: |
          mkdir -p dist
          cp "firmware/.pio/build/${{ matrix.environment }}/firmware.bin" "dist/elehant-svt15-${{ matrix.environment }}.bin"
          cd dist
          zip "elehant-svt15-${{ matrix.environment }}.zip" "elehant-svt15-${{ matrix.environment }}.bin"
      - name: Upload firmware ZIP
        uses: actions/upload-artifact@v4
        with:
          name: elehant-svt15-${{ matrix.environment }}
          path: dist/elehant-svt15-${{ matrix.environment }}.zip
          if-no-files-found: error
          retention-days: 30
