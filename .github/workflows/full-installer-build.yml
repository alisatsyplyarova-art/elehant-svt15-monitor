name: Full Windows Installer

on:
  push:
    branches: [master]
    tags:
      - "elehant-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set installer version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/elehant-v*") {
            $version = $env:GITHUB_REF_NAME.Substring("elehant-v".Length)
          } else {
            $version = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer version: $version"

      - name: Build main monitor and BLE service
        shell: pwsh
        run: .\scripts\build_exe.ps1

      - name: Build Graph Viewer
        shell: pwsh
        run: |
          $python = Join-Path $PWD ".venv\Scripts\python.exe"
          if (-not (Test-Path $python)) { throw "Python venv not found: $python" }
          & $python -m pip install matplotlib
          if ($LASTEXITCODE -ne 0) { throw "Failed to install matplotlib" }
          & $python -m py_compile tools\graph_viewer\elehant_graph_periods_manual.py
          if ($LASTEXITCODE -ne 0) { throw "Graph Viewer syntax check failed" }
          & $python -m PyInstaller --onefile --windowed --clean --noconfirm --name Elehant_Graph_Viewer --distpath release --workpath build-graph tools\graph_viewer\elehant_graph_periods_manual.py
          if ($LASTEXITCODE -ne 0) { throw "Graph Viewer EXE build failed" }
          if (-not (Test-Path "release\Elehant_Graph_Viewer.exe")) { throw "Graph Viewer EXE not found" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Inno Setup" }

      - name: Compile full installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=$env:APP_VERSION" "installer\Elehant_SVT15_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (-not (Test-Path "release\Elehant_SVT15_Setup.exe")) { throw "Installer EXE not found" }

      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          Get-FileHash release\Elehant_SVT15_Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  Elehant_SVT15_Setup.exe" } |
            Set-Content release\SHA256SUMS.txt -Encoding ascii

      - name: Upload full installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elehant_SVT15_Full_Installer_Windows_x64
          path: |
            release/Elehant_SVT15_Setup.exe
            release/SHA256SUMS.txt
            release/Elehant_SVT15_Monitor.exe
            release/Elehant_SVT15_Service.exe
            release/Elehant_Graph_Viewer.exe
          if-no-files-found: error
          retention-days: 60

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/elehant-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Elehant SVT-15 Monitor \${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release/Elehant_SVT15_Setup.exe
            release/SHA256SUMS.txt
