name: Graph Viewer — Windows EXE

on:
  push:
    branches: [master]
    tags:
      - "graph-viewer-v*"
    paths:
      - "tools/graph_viewer/**"
      - "docs/GRAPH_VIEWER.md"
      - ".github/workflows/graph-viewer-build.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib pyinstaller

      - name: Check Python syntax
        run: python -m py_compile tools/graph_viewer/elehant_graph_periods_manual.py

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --windowed --clean --noconfirm --name Elehant_Graph_Viewer --distpath release/graph-viewer tools/graph_viewer/elehant_graph_periods_manual.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elehant_Graph_Viewer-Windows-x64
          path: release/graph-viewer/Elehant_Graph_Viewer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/graph-viewer-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Elehant Graph Viewer ${{ github.ref_name }}"
          generate_release_notes: true
          files: release/graph-viewer/Elehant_Graph_Viewer.exe
